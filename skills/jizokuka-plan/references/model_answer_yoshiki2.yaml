project_id: tanaka_seika
koubo_id: r17
frame: 通常枠
specials: []
sections:
- key: company_overview
  heading: 企業概要
  body: '有限会社田中製菓は、1975年に長野県松本市中央で創業した和菓子製造小売業である。創業者は現代表者の父であり、地元の精米所に勤めた経験から、松本産の米を使った菓子づくりを志して独立した。現代表者の田中太郎（58歳）は1998年に2代目として事業を承継し、以後28年にわたり製造と経営を担っている。資本金は300万円、決算期は3月、常時使用する従業員は4名（製造3名、販売1名、うちパート2名）である。


    事業は、本店1店舗での製造小売を主軸に、市内旅館5軒への卸売を併営する形をとる。店舗は木造2階建てで、1階が製造場と売場、2階が事務所である。製造設備は1998年導入の餡練機（1回の処理量20kg）と2010年導入の蒸し器を中心に構成され、餡は原料の小豆から自社で炊き上げている。冷蔵設備は業務用冷蔵庫2台を保有するが、急速凍結の設備は持たない。


    主力商品は、どら焼き（1個180円）、大福（1個160円）、季節生菓子（1個250円から380円）の3系統で、常時18品目を製造している。品目別の売上構成比は、どら焼き32%、大福24%、季節生菓子21%、焼菓子・進物詰合せ23%である。チャネル別では店頭小売が72%、旅館への卸が28%を占める。


    店頭の客層は60代以上が約7割で、1日の来店客数は平日約45人、土日約80人、客単価は約780円である。旅館向けの卸は宿泊客の茶請け用として、1軒あたり月150個から300個を納品しており、卸単価は店頭価格の約7割である。


    直近3期の売上高は、2023年度4,200万円、2024年度3,800万円、2025年度3,500万円と推移し、3期で16.7%減少した。営業利益も同期間に310万円、210万円、120万円と減り、2025年度の売上高営業利益率は3.4%にとどまる。原価率は38%前後で安定しているため、利益の減少は売上減少と固定費負担によるものである。減少の主因は2つあり、第一に主商圏である店舗半径2km圏の人口減少、第二に既存客の高齢化による来店頻度の低下である。来店頻度は2023年度の月2.1回から2025年度には月1.6回へ落ちている。


    営業は年中無休を基本とし、年始の3日間のみ休業する。商圏は店舗半径2kmを主商圏、松本市全域を副商圏と位置づけており、市外からの来店は観光客が中心である。菓子製造業の営業許可を松本保健所から取得し、食品衛生責任者は代表者が務める。2021年10月に適格請求書発行事業者の登録を受け、旅館5軒との卸取引はすべて適格請求書での請求に移行済みである。

    '
- key: market_needs
  heading: 顧客ニーズと市場の動向
  body: '商圏の人口は減少が続いている。国勢調査によれば松本市の人口は2015年の24万3千人から2020年に24万1千人へ減り、65歳以上の割合は28.8%に達した。当社の主商圏である店舗半径2km圏の推計人口は約1万8千人で、同期間に約4%減少している。市の将来人口推計では2035年までにさらに約7%減る見通しであり、店頭販売のみに依存する限り、売上の回復は構造的に見込めない。


    一方で観光需要は回復している。県の観光地利用者統計調査によれば、松本市の観光入込客数は2020年度の約392万人から2024年度には約610万人へ戻った。松本城と中心市街地への来訪が牽引しており、当社店舗は松本城から徒歩8分の動線上にある。店頭でも観光客とみられる客の比率は、2023年度の約12%から2025年度には約19%へ上昇した。


    顧客からは具体的な要望が出ている。観光客からは「日持ちする商品を土産にしたい」「離れて暮らす家族に送りたい」という申し出が月20件前後あるが、季節生菓子は製造後2日で消費期限を迎えるため、現在はすべて断っている。卸先の旅館5軒からも、宿泊客の発送依頼を取り次げないかという相談を2024年以降で延べ14回受けた。断っている件数を月20件、年間240件とし、客単価を3,200円と置くと、年間約77万円の売上機会を取りこぼしている計算になる。


    EC側の環境も整ってきた。家計調査によれば、二人以上世帯の菓子類のインターネット購入額は、2019年の年間1,180円から2024年には2,340円へ5年で約2倍になった。贈答用途では、配送日指定と熨斗対応が購入の条件になる傾向がある。冷凍技術の普及により、従来は店頭でしか買えなかった生菓子をECで扱う事業者も現れており、購入行動として定着しつつある。


    以上から、主たるターゲットは松本を訪れた30代から40代の観光客と、旅館の宿泊客とする。贈答および帰省土産の用途で、単価2,800円から4,600円の詰合せを購入する層である。この層は配送を前提に購入するため、店舗までの距離に縛られない。当社は現在、この需要に応える手段を持っていない。


    狙う市場の規模を推計する。松本市の観光入込客数610万人のうち、宿泊を伴う客を約2割の122万人と置く。さらに土産に和菓子を選ぶ層をその1割の12万人、うち配送を希望する層を5%とすると、年間6,100人となる。客単価3,200円を掛けると約1,950万円の市場が商圏内に存在する計算になる。当社が初年度に狙うのは、このうち約10%にあたる200万円である。


    代替されうる土産物としては、信州そば、りんご加工品、日持ちのする焼菓子がある。いずれも常温で流通できるため、この点で当社の生菓子は不利な立場にある。冷凍発送に対応することは、この不利を解消して同じ土俵に立つことを意味する。

    '
- key: competition
  heading: 競合他社との比較
  body: '松本市内で和菓子を製造小売する同業は約20店ある。このうち、商圏と客層が重なる2社を競合として比較する。


    【競合A社】松本城周辺の老舗和菓子店

    創業は明治期、従業員8名、本店と駅ビル店の2店を構える。主力は干菓子と最中で、日持ちする商品を軸に品揃えを組んでいる。価格帯は1個200円から300円と、当社の160円から380円に対しやや高い水準にある。全国発送は常温便で行っており、中元と歳暮の時期を中心に取り扱っている。強みは店舗数と知名度、および常温で送れる商品構成である。一方、生菓子の取扱は店頭限定で、餡は外部から仕入れている。


    【競合B社】駅ビルに出店する菓子製造業

    創業1985年、従業員12名。焼菓子を主力とし、2022年から冷凍による全国発送を始めた。詰合せの価格帯は2,500円から5,000円で、当社が想定する2,800円から4,600円と重なる。自社ECサイトを3年運用しており、この点では当社より先行している。ただし冷凍で送っているのは焼菓子のみで、生菓子の冷凍発送は行っていない。


    【比較の整理】

    ・顧客層: A社は観光客と法人贈答、B社は駅利用者と若年層、当社は地元の60代以上が中心で観光客は約19%

    ・価格: A社は当社の約1.2倍、B社の詰合せは当社の想定と同水準

    ・主力商品: A社は干菓子と最中、B社は焼菓子、当社は生菓子

    ・餡: A社は外部仕入れ、B社は焼菓子主体で餡の比重が低い、当社は原料から内製

    ・EC: A社は常温発送のみ、B社は冷凍発送を3年運用、当社は未着手


    【当社が優位な点】

    餡を内製し、冷凍に耐える配合を自社で作れることである。A社は餡を外部から仕入れるため配合を変えられず、B社は焼菓子が主体で生菓子の冷凍に関する知見を持たない。松本市内で「冷凍した生菓子を全国に送る」事業者は、把握できる範囲で存在しない。当社が狙うのはこの空白である。


    【当社が劣位な点】

    第一にEC運用の経験である。B社は3年先行しており、当社は受注・梱包・配送の業務設計から始める必要がある。第二に知名度で、A社の2店に対し当社は1店であり、駅前への出店もない。


    この劣位は、旅館5軒と店頭という既存の接点を初期顧客の獲得に充てることで補う。B社が持たない生菓子の冷凍という商品差で市場に入り、運用の遅れは取扱を3品に絞ることで補う。規模が小さいことは、品目を絞って品質を確認しながら進められるという点では有利に働く。

    '
- key: strengths
  heading: 自社や自社の提供する商品・サービスの強み
  body: '自社の強みは4点ある。


    第一に、餡を内製していることによる配合調整の自由度である。創業以来50年にわたり原料の小豆から炊き上げまでを自社で行っており、糖度を44度から52度の範囲で1度刻みに調整できる。既製餡を仕入れる同業他社では踏み込めない領域である。冷凍後の離水を抑える低糖度配合の試作を2025年度に社内で12回実施し、44度配合で解凍後の離水量が最も少ないことを確認している。


    第二に、原材料の産地を特定できることである。米粉は松本市内の精米所から、小豆は北海道十勝産を、それぞれ固定の仕入先から20年以上継続して調達している。保存料・着色料・人工甘味料は使用しておらず、原材料表示は1品あたり7品目以内に収まる。贈答用途で原材料を確認する購入者に対し、産地と配合を説明できる状態にある。


    第三に、卸先である市内旅館5軒との20年を超える取引である。各旅館の女将から宿泊客の反応が直接得られるため、新商品の受容性を試作段階で確認できる。2024年度に投入した3品のうち2品は旅館からの指摘を受けて配合を変更したもので、変更後の月販数は変更前の約1.4倍になった。


    第四に、立地である。店舗は松本城から徒歩8分の観光動線上にあり、観光客が通りかかる機会がある。この立地は、ECの初期顧客を店頭で獲得する導線として使える。


    弱みも3点ある。第一に、認知が店舗半径2km圏に限られ、商圏の外に当社の存在が知られていないこと。第二に、季節生菓子の日持ちが短く、遠方への発送ができないこと。第三に、ECの運用経験がなく、受注・梱包・配送の業務設計を持たないことである。


    強みである餡の調整技術、原材料の特定可能性、旅館との取引関係は、いずれも商圏外の顧客に届いていない。弱みが強みを封じている状態であり、この封じを解くことが本補助事業の狙いである。


    これらの強みは第三者からも確認できる。2023年に長野県が実施した県産食材活用の取組紹介では、当社の自家製餡が事例として掲載された。旅館5軒のうち3軒は、館内の茶請けとして当社の商品を10年以上継続して採用している。取引が長期にわたり続いていること自体が、品質と納期の安定性を示す実績である。


    なお、価格面での差別化は図っていない。どら焼き1個180円は市内同業の平均的な価格帯であり、当社は価格ではなく、原材料の特定可能性と餡の配合によって選ばれている。


    弱みのうち、認知の狭さとECの運用経験の不足は、設備がなくても着手できる課題である。しかし日持ちの短さは設備でしか解決できない。急速凍結の設備を持たない限り、他の2つの弱みを解消しても発送はできず、強みは商圏内に閉じたままになる。

    '
- key: policy_and_plan
  heading: 経営方針・目標と今後のプラン
  body: '経営理念は「松本の米と小豆で、日常の区切りに置ける菓子をつくる」ことである。日常的に買える価格帯と、贈答に耐える仕上がりの両立を、創業以来の方針としてきた。


    経営方針は、店頭小売への依存から脱し、商圏外の顧客への冷凍発送を第二の収益の柱とすることである。商圏人口の減少は今後も続く一方、観光客と旅館宿泊客には発送需要が実在し、当社は糖度調整の技術によって冷凍に耐える配合を作れる。届いていない顧客に、冷凍という手段で届ける。これが方針の骨子である。


    数値目標は次のとおり置く。

    ・2026年度（初年度）: 売上高3,700万円（うちEC売上200万円）、営業利益180万円

    ・2027年度: 売上高4,000万円（うちEC売上450万円）、営業利益320万円

    ・2028年度: 売上高4,300万円（うちEC売上700万円）、営業利益450万円

    ・2029年度: 売上高4,600万円（うちEC売上950万円）、営業利益560万円

    ・2030年度: 売上高4,900万円（うちEC売上1,200万円）、営業利益670万円


    店頭・卸の売上は年間3,500万円前後で横ばいと見込み、増加分はすべてEC経由とする。初年度のEC売上200万円は、下期からの稼働を前提とした金額である。5年後にはEC比率を約24%まで高め、人口減少による店頭売上の下振れを吸収できる収益構造にする。


    達成の手順は3段階とする。


    第1段階（2026年度から2027年度）は、冷凍適性を確認できた季節生菓子3品に絞ってECで販売し、旅館5軒に発送案内カードを置いて初期顧客を確保する。この段階の目標は、年間購入者600人とリピート率30%の確保である。


    第2段階（2028年度）は、取扱を8品に広げ、法人の贈答需要に応じるため熨斗・名入れ・請求書払いを整備する。中元と歳暮の2シーズンで、法人受注を年間200件確保することを目標とする。


    第3段階（2029年度から2030年度）は、代表者の長男（32歳）のUターンを前提に、ECの運用と新商品開発を移管する。並行して事業承継の実務に着手し、2030年度までに経営権の移転を終える。


    本補助事業は第1段階に位置づけられる。冷凍設備とECサイトがなければ第1段階が成立せず、第2段階以降にも着手できない。逆に第1段階が確立すれば、以降の拡大は追加の設備投資を要さず、取扱品目と販路の拡張で対応できる。


    この方針は、1から3で整理した状況から導いている。商圏人口が減り既存客の来店頻度が落ちる一方で、観光客と旅館宿泊客からは発送の要望が実際に発生している。そして当社には、冷凍に耐える配合を作れる技術がある。減っていく需要を追うのではなく、断り続けてきた需要を拾う。これが方針を立てた根拠である。


    投資回収の見通しは次のとおりである。本補助事業における自己負担額は850,000円であり、初年度の営業利益増加額約87万円に対して回収期間は1年未満となる。2年目以降は追加の設備投資を要さないため、EC売上の増加分はそのまま利益の増加につながる。

    '
project_sections:
- key: project_name
  heading: 補助事業で行う事業名
  body: '冷凍生菓子のEC販売による全国贈答市場への販路開拓

    '
- key: sales_channel
  heading: 販路開拓等（生産性向上）の取組内容
  body: '【事業の概要】

    季節生菓子を急速凍結して全国に発送する体制を構築し、自社ECサイトで販売する。取組は(1)冷凍設備の導入、(2)冷凍適性に合わせた商品改良と包装、(3)自社ECサイトの構築、(4)首都圏での認知獲得の4つで構成する。補助事業期間は2026年4月から10月までの7か月とし、8月から販売を開始する。初年度の下期でEC売上200万円を確保することを目標とする。


    【導入の背景と目的】

    当社が発送需要に応えられない原因は、技術ではなく設備にある。糖度調整によって冷凍に耐える配合は作れるが、緩慢凍結しかできない業務用冷蔵庫では、餡の水分が氷結晶化して解凍時に離水し、食感が変わる。2025年度に家庭用冷凍庫で行った試作では、解凍後に表面が水っぽくなり、贈答品として出せる状態にならなかった。急速凍結設備の有無が、発送事業の成否を分ける。本補助事業の目的は、この設備上の制約を外し、商圏外の需要を売上に変えることである。


    【(1) 冷凍設備の導入】

    CAS機能付き特殊冷凍機1台（800,000円）を導入する。CAS方式は磁場を与えながら急速凍結することで氷結晶を微細化し、細胞壁の破壊を抑える方式で、解凍後の離水と食感変化を抑制できる。導入機は庫内容量80L、到達温度マイナス35度で、1回あたり生菓子120個を約40分で凍結できる。当社の現在の製造ロットは1品目あたり60個から80個であり、1回の運転で1ロットを処理できる。設置場所は1階製造場の北側とし、単相200Vの電源増設工事を伴う。機種の選定にあたっては、庫内容量が当社の製造ロットに対して過大にならないことを条件とした。容量の大きい機種は導入費も電力消費も増えるが、1ロット60個から80個の当社では持て余す。80Lは1ロットを1回で処理でき、かつ将来の増産にも対応できる大きさである。


    【(2) 商品改良と包装】

    餡の糖度を既存の48度から44度に下げた冷凍専用配合を、季節生菓子3品（水まんじゅう、栗蒸し羊羹、いちご大福）に適用する。補助事業期間中に、導入した冷凍機で各品10回ずつの再試作を行い、解凍手順（冷蔵庫で6時間）を確定する。


    包装は、冷凍配送と結露に耐える化粧箱とパッケージのデザインを外部に委託する（270,000円）。6個入り2,800円、12個入り4,600円の2規格とし、贈答用途の熨斗に対応する。化粧箱には解凍手順と消費期限を印刷し、受け取った人が扱いに迷わない状態にする。既存の店頭用パッケージは冷凍に対応しておらず流用できないため、新規に制作する必要がある。


    【(3) 自社ECサイトの構築】

    冷凍配送に対応した自社ECサイトを構築する（180,000円）。クール便の送料を配送先地域別に自動計算し、熨斗・名入れ・配送日指定を購入画面で選択できる仕様とする。モールではなく自社サイトとするのは、販売手数料の負担を避けるためと、購入者の連絡先を自社で保有して次回以降の案内に使うためである。


    初期顧客の獲得は店頭と旅館から行う。店頭では、発送を希望しながら断ってきた客に対し、会計時にECの案内カードを渡す。旅館5軒には、客室に置く発送案内カードにQRコードを印刷し、宿泊客が滞在中に注文できる導線を作る。旅館には1件あたり200円の取次手数料を支払う。


    【(4) 首都圏での認知獲得】

    首都圏で開催されるギフト見本市に出展する（出展料100,000円）。来場するギフト専門店・百貨店の担当者に解凍後の実物を試食提供し、法人贈答の取引開拓につなげる。個人向けのECと並行して法人販路を持つことで、中元と歳暮の需要を取り込む。出展時には、解凍手順と配送条件を記載した商談用資料を用意する。


    【実施スケジュール】

    ・4月: 冷凍機の機種選定と発注、電源増設工事の手配、EC制作会社の選定

    ・5月: 冷凍機の搬入・設置と電源工事、冷凍専用配合の最終試作（3品各10回）

    ・6月: 解凍手順の確定、パッケージデザインの確定、ECサイトの構築着手

    ・7月: 化粧箱の納品、ECサイト公開、旅館5軒への発送案内カード設置

    ・8月: 販売開始。初期注文20件の配送品質を検証し、梱包と保冷材を調整

    ・9月: 首都圏ギフト見本市に出展、法人取引の商談

    ・10月: 販売データを踏まえ、取扱品目と価格を見直し


    【実施体制】

    代表者が冷凍工程と商品改良を担当し、販売担当1名がECの受注・出荷を担当する。EC制作とデザインは外部委託とし、社内で新たに発生する業務は受注処理と梱包に限定する。受注処理は1件あたり約8分と見積もり、月60件で月8時間である。これは業務効率化により生まれる余力の範囲に収まるため、人員を増やさずに対応できる。


    【想定されるリスクと対応】

    解凍後の品質が想定に届かない場合に備え、8月の販売開始前に、旅館5軒の女将と店頭の常連客20名に試食を依頼して評価を確認する。評価が基準に届かない品目は初年度の取扱から外し、他の品目に振り替える。配送中の温度上昇に対しては、クール便の指定と保冷材の同梱で対応する。受注が想定を下回った場合は、9月の見本市で得た法人商談を優先し、個人向けの広告費を法人開拓に振り替える。


    【補助事業の効果測定】

    販売開始後は月次で次の指標を記録し、翌月の施策に反映する。第一にEC注文件数と客単価、第二に流入経路別の内訳（店頭カード、旅館カード、見本市経由）、第三に解凍後の品質に関する購入者からの申し出件数である。第三の指標が月2件を超えた場合は、該当品目の出荷を止めて配合と梱包を見直す。品質への申し出を管理指標に置くのは、贈答用途では受け取った人の評価が次の注文を左右するためである。


    【補助事業終了後の展開】

    補助事業期間の7か月で確立するのは、3品を発送できる体制である。終了後は、確立した解凍手順と梱包を他の品目へ展開する。冷凍機の処理能力は1回120個、1日3回の運転で360個であり、現在の製造量に対して余力がある。取扱を8品まで広げても設備の増設は要さない。

    '
- key: efficiency
  heading: 業務効率化（生産性向上）の取組内容【任意記入】
  body: '急速凍結機の導入は、販路開拓だけでなく製造計画の組み方も変える。現在は季節生菓子の日持ちが2日であるため、旅館5軒の注文数を前日夕方に確認してから翌朝に製造しており、少量多頻度の製造を月あたり22回行っている。冷凍保存ができれば、製造をまとめて行い在庫から出荷できるため、製造回数を月8回に減らせる。


    1回あたりの段取り（餡の炊き上げ、蒸し器の立ち上げ、器具の洗浄と清掃）に約50分を要しており、製造回数が月14回減ることで、月あたり約11時間40分、年間では約140時間の作業時間が削減される。削減された時間は、ECの受注処理（月約8時間）と新商品の試作に充てる。これにより、人員を増やさずに新規業務を吸収できる。


    製造をまとめることで、原材料の発注回数も月4回から月2回に減らせる。1回あたりの発注と検品に約30分を要しており、月1時間の削減となる。


    廃棄も減る。消費期限切れで廃棄していた季節生菓子は2025年度で月平均34個、年間408個であり、製造数に対する廃棄率は3.1%であった。冷凍保存により廃棄をほぼ解消でき、原材料費ベースで年間約4万9千円の損失を回避できる。廃棄が減ることは、製造数を注文数に厳密に合わせる必要がなくなることを意味し、製造計画の自由度も高まる。


    作業時間の削減は労働生産性の指標にも表れる。2025年度の従業員1人あたり売上高は875万円であるが、削減した年間140時間を新規業務に充てることで、人員を増やさずに売上を伸ばせる。年間140時間は、パート1名の年間労働時間の約1割に相当する。削減時間の配分は、ECの受注処理に月8時間、新商品の試作に月4時間を想定している。


    なお、製造回数を減らしても、できたての商品を求める店頭客への対応は変えない。店頭向けは従来どおり当日製造を続け、まとめて製造して冷凍するのは発送用と旅館向けの一部に限る。店頭の品質を落として効率を取ることはしない。

    '
- key: effect
  heading: 補助事業の効果
  body: '【(1) 自社への効果 — 売上】

    EC売上は初年度200万円、3年目700万円、5年目1,200万円を見込む。初年度の内訳は、客単価3,200円 × 新規購入者52人/月 × 12か月 = 年間1,996,800円である。客単価は、6個入り2,800円と12個入り4,600円の販売構成比を7対3として算出した。


    新規購入者52人/月は、3つの経路の合計である。第一に、店頭で発送を希望しながら断ってきた月20件。第二に、旅館5軒の宿泊客からの取次で月14件。第三に、ギフト見本市を経由した法人注文で月18件。いずれも過去の実績件数、または旅館から受けた相談件数を根拠としている。2年目以降は、初年度購入者のリピート率を30%と見込み、新規獲得分と合わせて積み上げる。


    【(2) 自社への効果 — 利益】

    粗利率は店頭販売の62%に対し、EC販売は送料負担分を除いて54%と見込む。初年度の粗利増加額は 1,996,800円 × 54% = 約107万円となる。ここからEC運用費と広告費の年間約20万円を差し引くと、営業利益ベースの増加は約87万円である。2025年度の営業利益120万円に対して約72%の増加に相当する。3年目にEC売上700万円へ達すれば、粗利増加は 7,000,000円 × 54% = 378万円となり、売上高営業利益率は2025年度の3.4%から10%台へ改善する見込みである。


    【(3) 生産性の向上】

    従業員1人あたりの売上高は、2025年度の875万円から、初年度に925万円、3年目に1,075万円へ向上する。人員を増やさずに売上を増やせるのは、製造回数の削減により月約12時間の余力が生まれるためである。


    【(4) 地域・取引先・雇用への効果】

    卸先の旅館5軒は宿泊客の発送依頼を取り次げるようになり、1軒あたり年間約34件の取次手数料収入（1件200円）を得る。宿泊客の要望に応えられることは、旅館側の顧客対応の幅も広げる。小豆と米粉の仕入先2社に対しては、製造量の増加により年間の発注額が約38万円増える見込みである。冷凍発送に対応した和菓子が松本市の土産物に加わることは、同様の設備を持たない市内他店にも展開できる形式であり、地域の土産需要の受け皿を広げる。3年目以降、EC売上が700万円規模となった時点でパート1名の新規雇用を検討する。

    '
