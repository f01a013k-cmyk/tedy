# ============================================================================
# ヒアリングシート — 小規模事業者持続化補助金
# ============================================================================
# 【記入のお願い】
#   ・文章にする必要はありません。**単語の羅列で結構です。**
#   ・分からない項目・答えにくい項目は空欄のままで構いません。
#     こちらで推測し、本当に必要なことだけ後から数問お尋ねします。
#   ・数字は分かる範囲で。「4200万」「約350万」のような書き方で構いません。
# ============================================================================

project_id: sample          # 案件を識別する名前（英数字）
koubo_id: r17               # 公募要領のID
frame: 通常枠               # 通常枠 / 賃金引上げ枠 / 卒業枠 / 後継者支援枠 / 創業枠
specials: []                # 例: [インボイス特例]

company:
  name:                     # 事業者名
  representative:           # 代表者名
  address:                  # 所在地（市区町村まで）
  founded:                  # 創業年（西暦）
  employees:                # 常時使用する従業員数
  industry:                 # 業種
  business: []              # 事業内容（単語可）例: [和菓子製造, 小売]
  products: []              # 主力商品・サービス 例: [どら焼き, 大福]
  customers: []             # 顧客層 例: [地元高齢者, 観光客]
  channels: []              # 販売チャネル 例: [店頭, 卸, 催事]
  area: []                  # 商圏 例: [松本市内, 長野県中信地区]
  sales: {}                 # 年度→売上高 例: {2023: 42000000, 2024: 38000000}
  profit: {}                # 年度→営業利益 例: {2025: 1200000}
  is_invoice_registered:    # インボイス登録済みか true/false
  is_deficit:               # 赤字事業者か true/false（賃金引上げ枠の補助率に影響）

strengths: []               # 強み（単語可）例: [創業50年, 自家製餡, 無添加]
weaknesses: []              # 弱み・困りごと 例: [人口減, 後継者不在, 認知度低い]
market: []                  # 市場で感じている変化 例: [観光回復, 土産需要, EC拡大]
goal: []                    # 今後やりたいこと 例: [EC進出, 若年層開拓, 全国発送]

project:
  idea: []                  # 補助金で取り組みたいこと 例: [冷凍機導入, ECサイト, 冷凍配送]
  target_customer: []       # 誰に売りたいか 例: [首都圏の30-40代, 贈答需要]
  schedule_note:            # 実施時期の希望
  expenses:                 # 買いたいもの・かかりそうな費用（概算で可）
    - category:             # 経費区分（分からなければ空欄）
      item:                 # 品名 例: 特殊冷凍機
      amount:               # 金額（税抜） 例: 800000

policy_bonus: []            # 該当する加点項目 例: [経営力向上計画, 事業承継]

free_notes: |
  面談メモ・その他伝えたいことを自由に。箇条書きで構いません。
