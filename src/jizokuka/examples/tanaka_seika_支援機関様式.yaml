# ============================================================================
# 支援機関様式（事業計画書）への流し込み内容 — 模範解答
# ============================================================================
# ⚠️ 事業者・数値・統計・人名はすべて架空です。書き方の型を示すためのもので、
#    統計数値や社名をそのまま引用しないでください。
#
# 対応する様式: src/jizokuka/forms/事業計画書_支援機関様式.docx
# 使い方:       jizokuka sample --form shien -o ./out
#
# blocks のキーは様式の章番号。章番号が重複する項目（2-2 が2つ、3-2 が2つ）は
# "2-2|顧客ニーズ" のように見出し語で絞り込む。
# tables のキーは様式内の表の出現順（0 始まり）。
#   行見出し（1列目）と列見出し（1行目）でセルを特定して埋める。
#   __extra_rows__ は、様式に用意された空行や「他は自由に項目を挙げてください」の
#   行に、行見出しごと書き込むためのもの。
# ============================================================================

form: shien
blocks:
  1-1-1: '当社は1975年、現代表者の父である田中一郎が松本市中央に開業した和菓子店である。屋号の「田中製菓」は創業者の姓をそのまま用いたもので、地域に顔の見える商いをするという考えから、あえて雅号を付けなかった。

    創業者は長野県内の高校を卒業後、松本市内の精米所に8年勤めた。米の等級や産地による炊き上がりの違いを日々扱ううちに、松本産の米を使った菓子を自分で作りたいと考えるようになった。1972年に市内の和菓子店へ移って3年間修業し、1975年に独立した。

    現代表者の田中太郎（58歳）は、大学卒業後に東京の食品商社で5年間、原材料の仕入業務に従事した。1996年に帰郷して家業に入り、1998年に2代目として事業を承継した。仕入先の選定と原価管理を商社時代の経験に基づいて見直し、小豆と米粉の調達先を現在の2社に固定したのは、承継後の取組である。'
  1-1-2: '本店1店舗での製造小売を主軸に、市内旅館5軒への卸売を併営している。製造はすべて店舗1階の製造場で行い、外注や委託製造は行っていない。

    主力商品は、どら焼き、大福、季節生菓子の3系統で、常時18品目を製造している。季節生菓子は水まんじゅう、栗蒸し羊羹、いちご大福など、年間で延べ12種を入れ替えながら販売する。

    売上構成比は、どら焼き32%、大福24%、季節生菓子21%、焼菓子・進物詰合せ23%である。チャネル別では店頭小売が72%、旅館への卸が28%を占める。

    餡は原料の小豆から自社で炊き上げており、既製餡の仕入れは行っていない。保存料・着色料・人工甘味料は使用せず、原材料表示は1品あたり7品目以内に収まる。

    品目別の単価、1日あたりの販売個数、利益率は下表のとおりである。'
  1-1-3: '代表　　　田中　太郎　　1名（担当業務：製造全般、餡の炊き上げ、仕入先との交渉、経営判断）

    製造　　　田中　花子　　1名（担当業務：生菓子の成形、包装、衛生管理）

    パート　　中村　みどり　1名（担当業務：焼菓子の製造補助、器具洗浄）

    販売　　　小林　かおり　1名（担当業務：店頭接客、レジ、旅館への納品）

    常時使用する従業員は4名（うちパート1名）である。補助事業では、代表者が冷凍工程と商品改良を、販売担当の小林がECの受注・出荷を担当する。'
  1-2-1: 直近3期の実績と今期予想は下表のとおりである。金額は万円単位、千円未満を切り捨てた概算である。原価率は38%前後で推移している。
  1-2-2: '売上高は3期で16.7%減少した。減少額1,700万円の内訳は、店頭小売が約1,300万円、旅館への卸が約400万円である。

    店頭の減少は客数の減少による。来店客数は2023年度の1日平均96人から2025年度には88人へ減り、1人あたりの来店頻度も月2.1回から1.6回へ低下した。客単価は約780円でほぼ変わっていないため、落ちているのは単価ではなく客数と頻度である。

    卸の減少は、取引先の旅館1軒が2024年に廃業したことによる。残る5軒への納品量は横ばいである。

    原価率は38%前後で安定しており、仕入価格の上昇分は歩留まりの改善で吸収できている。一方、販管費は2023年度2,294万円から2025年度2,050万円へ244万円しか減っておらず、売上の減少幅700万円に追いついていない。固定費の比重が高いため、売上が減ると営業利益が急速に目減りする構造にある。実際、営業利益は310万円から120万円へ61%減少し、売上高営業利益率は7.4%から3.4%へ低下した。

    以上から、当社の課題は原価でも単価でもなく、客数の確保である。商圏内で客数を取り戻す手段は乏しいため、商圏の外に客を求める必要がある。'
  1-3-1: '営業面の課題は、販路が店頭と市内旅館に限られていることである。店舗半径2km圏の人口は減少が続いており、この商圏の中だけで客数を戻す手立てがない。観光客からの発送依頼が月20件前後あるが、商品の日持ちが2日であるため、すべて断っている。売上になりうる需要を取りこぼしている。

    広報面の課題は、当社を知る手段が店頭と口コミしかないことである。ウェブサイトを持たず、SNSの運用もしていない。商圏外の顧客が当社を見つける経路が存在しない。

    バックオフィスの課題は、製造計画が日々の注文に振り回されていることである。日持ちが短いため前日夕方に注文を確認してから翌朝に製造しており、少量多頻度の製造を月22回行っている。1回あたり約50分の段取りが発生し、月約18時間が段取りに費やされる。消費期限切れの廃棄も月平均34個、年間408個（廃棄率3.1%）発生している。

    承継面の課題は、代表者が58歳であり、長男（32歳）のUターンが予定されているものの、承継後に任せられる新しい収益の柱がないことである。'
  1-3-2: '上記4つの課題を、急速凍結設備の導入とECサイトの構築で同時に補う。

    営業面の課題に対しては、生菓子を冷凍して全国に発送できるようにし、断ってきた月20件の需要を売上に変える。商圏の外に販路を作ることが目的である。

    広報面の課題に対しては、自社ECサイトを商圏外の顧客との接点とする。あわせて首都圏のギフト見本市に出展し、法人贈答の販路も並行して開く。

    バックオフィスの課題に対しては、冷凍保存によって製造をまとめられるようにする。製造回数を月22回から8回に減らし、月約11時間40分の段取り時間を削減する。廃棄もほぼ解消できる。

    承継面の課題に対しては、ECという新しい柱を長男に移管できる形で立ち上げる。既存の店頭・卸とは独立して運用できるため、承継の単位として切り出しやすい。

    いずれの課題も、急速凍結設備がなければ着手できない。設備が制約になっているため、補助事業の中核に設備導入を据える。'
  2-1: '主たるターゲットは、松本を訪れた30代から40代の観光客と、旅館の宿泊客である。贈答および帰省土産の用途で、単価2,800円から4,600円の詰合せを購入する層を想定する。この層は配送を前提に購入するため、店舗までの距離に縛られない。

    副次のターゲットは、首都圏のギフト専門店と百貨店の法人贈答担当である。中元と歳暮の時期に、1件あたり20個から50個の単位で発注する層である。

    既存の店頭客（60代以上が約7割）は引き続き主要顧客であるが、この層の人数は商圏人口の減少に伴って減る。新規のターゲットは、既存客の置き換えではなく上積みとして位置づける。'
  2-2|市場の動向: '商圏の人口は減少が続いている。国勢調査によれば松本市の人口は2015年の24万3千人から2020年に24万1千人へ減り、65歳以上の割合は28.8%に達した。当社の主商圏である店舗半径2km圏の推計人口は約1万8千人で、同期間に約4%減少している。市の将来人口推計では、2035年までにさらに約7%減る見通しである。

    一方で観光需要は回復している。県の観光地利用者統計調査によれば、松本市の観光入込客数は2020年度の約392万人から2024年度には約610万人へ戻った。当社店頭でも観光客とみられる客の比率は、2023年度の約12%から2025年度には約19%へ上昇した。

    EC側の環境も整ってきた。家計調査によれば、二人以上世帯の菓子類のインターネット購入額は、2019年の年間1,180円から2024年には2,340円へ5年で約2倍になった。冷凍技術の普及により、従来は店頭でしか買えなかった生菓子をECで扱う事業者も現れている。

    狙う市場の規模を推計する。観光入込客数610万人のうち宿泊を伴う客を約2割の122万人、土産に和菓子を選ぶ層をその1割の12万人、うち配送を希望する層を5%とすると、年間6,100人となる。客単価3,200円を掛けると約1,950万円の市場が商圏内に存在する計算になる。当社が初年度に狙うのは、このうち約10%にあたる200万円である。'
  2-2|顧客ニーズ: '顧客からは具体的な要望が出ている。観光客からは「日持ちする商品を土産にしたい」「離れて暮らす家族に送りたい」という申し出が月20件前後あるが、季節生菓子は製造後2日で消費期限を迎えるため、現在はすべて断っている。

    卸先の旅館5軒からも、宿泊客の発送依頼を取り次げないかという相談を2024年以降で延べ14回受けた。旅館側は、宿泊客の要望に応えられないことを機会損失と捉えている。

    断っている件数を月20件、年間240件とし、客単価を3,200円と置くと、年間約77万円の売上機会を取りこぼしている計算になる。

    贈答用途では、配送日指定と熨斗対応が購入の条件になる傾向がある。また受け取った側が扱いに迷わないよう、解凍手順の表示を求める声が試食時に出ている。

    要約すると、ニーズは「松本の和菓子を、離れた家族や知人へ、日持ちする形で、贈答の体裁を整えて贈りたい」である。当社はこの要望に応える手段を現在持っていない。'
  2-3: '松本市内で和菓子を製造小売する同業は約20店ある。このうち、商圏と客層が重なる2社を競合として比較する（本書は架空の事例のため、社名をA社・B社と表記している）。

    A社は松本城周辺の老舗和菓子店である。創業は明治期、従業員8名、本店と駅ビル店の2店を構える。主力は干菓子と最中で、日持ちする商品を軸に品揃えを組んでいる。価格帯は1個200円から300円と、当社の160円から380円に対しやや高い。全国発送は常温便で行っており、中元と歳暮の時期を中心に取り扱っている。一方、生菓子の取扱は店頭限定で、餡は外部から仕入れている。

    B社は駅ビルに出店する菓子製造業である。創業1985年、従業員12名。焼菓子を主力とし、2022年から冷凍による全国発送を始めた。詰合せの価格帯は2,500円から5,000円で、当社が想定する2,800円から4,600円と重なる。自社ECサイトを3年運用しており、この点では当社より先行している。ただし冷凍で送っているのは焼菓子のみで、生菓子の冷凍発送は行っていない。

    当社が優位なのは、餡を内製し、冷凍に耐える配合を自社で作れることである。A社は餡を外部から仕入れるため配合を変えられず、B社は焼菓子が主体で生菓子の冷凍に関する知見を持たない。松本市内で「冷凍した生菓子を全国に送る」事業者は、把握できる範囲で存在しない。当社が狙うのはこの空白である。

    当社が劣位なのは、第一にEC運用の経験である。B社は3年先行しており、当社は受注・梱包・配送の業務設計から始める必要がある。第二に知名度で、A社の2店に対し当社は1店であり、駅前への出店もない。

    この劣位は、旅館5軒と店頭という既存の接点を初期顧客の獲得に充てることで補う。B社が持たない生菓子の冷凍という商品差で市場に入り、運用の遅れは取扱を3品に絞ることで補う。規模が小さいことは、品目を絞って品質を確認しながら進められるという点では有利に働く。'
  3-1: '① 餡を内製しており、糖度を44度から52度の範囲で1度刻みに調整できる

    ② 米粉と小豆の仕入先を20年以上固定しており、産地を特定して説明できる

    ③ 市内旅館5軒と20年を超える取引があり、新商品の反応を試作段階で確認できる

    ④ 店舗が松本城から徒歩8分の観光動線上にあり、観光客との接点がある

    餡の内製は、冷凍対応の可否を左右する強みである。既製餡を仕入れる同業では配合を変えられないが、当社は冷凍後の離水を抑える低糖度配合を自社で試作できる。2025年度に社内で12回の試作を行い、44度配合で解凍後の離水量が最も少ないことを確認している。

    旅館5軒との取引は、新商品の検証装置として機能している。2024年度に投入した3品のうち2品は旅館からの指摘を受けて配合を変更したもので、変更後の月販数は変更前の約1.4倍になった。'
  3-2|自社の提供する商品・サービスの強み: '① 保存料・着色料・人工甘味料を使用せず、原材料表示が1品あたり7品目以内に収まる

    ② 主原料の産地が特定でき、米粉は松本市内の精米所、小豆は北海道十勝産である

    ③ 餡の糖度を用途に応じて調整できるため、冷凍向けの専用配合を作れる

    贈答用途では、受け取る側が原材料を確認する場面がある。原材料表示が短く、産地を答えられることは、贈る側が選びやすい条件になる。

    価格面での差別化は図っていない。どら焼き1個180円は市内同業の平均的な価格帯であり、当社は価格ではなく、原材料の特定可能性と餡の配合によって選ばれている。'
  3-3: '① 認知が店舗半径2km圏に限られ、商圏の外に当社の存在が知られていない

    ② ECの運用経験がなく、受注・梱包・配送の業務設計を持たない

    ③ 店舗が1店のみで、駅前など人通りの多い場所への出店がない

    ④ 製造の中核工程を代表者1人が担っており、業務が集中している

    このうち②は、競合B社が3年先行している領域である。当社は業務設計から始める必要があるため、初年度は取扱を3品に絞って運用を確立する。①と③は、旅館5軒と店頭という既存の接点を初期顧客の獲得に充てることで補う。'
  3-2|自社の提供する商品・サービスの弱み: '① 季節生菓子の消費期限が製造後2日で、遠方への発送ができない

    ② 既存の店頭用パッケージが冷凍・結露に対応しておらず、発送に流用できない

    ③ 常温で日持ちする商品の構成比が低く、土産需要を取り込みにくい

    ①が最も大きい制約である。強みである餡の調整技術も、日持ちの短さによって商圏内に封じられている。急速凍結の設備がなければ、②と③を解消しても発送はできない。本補助事業は、この制約を外すことを目的としている。'
  4-1: '「松本の米と小豆で、日常の区切りに置ける菓子をつくる」ことを理念としている。

    日常的に買える価格帯と、贈答に耐える仕上がりの両立を、創業以来の方針としてきた。ハレの日だけの菓子ではなく、来客、法要、季節の変わり目といった日常の区切りに使われる菓子であることを、商品構成と価格の基準に置いている。

    この理念は、原材料の産地を固定し、餡を内製し続けるという製造上の判断にも表れている。'
  4-2: '経営方針は、店頭小売への依存から脱し、商圏外の顧客への冷凍発送を第二の収益の柱とすることである。商圏人口の減少は今後も続く一方、観光客と旅館宿泊客には発送需要が実在し、当社は糖度調整の技術によって冷凍に耐える配合を作れる。届いていない顧客に、冷凍という手段で届ける。これが方針の骨子である。

    数値目標は次のとおり置く。

    2026年度（初年度）　売上高3,700万円（うちEC売上200万円）、営業利益180万円

    2027年度　　　　　　売上高4,000万円（うちEC売上450万円）、営業利益320万円

    2028年度　　　　　　売上高4,300万円（うちEC売上700万円）、営業利益450万円

    2029年度　　　　　　売上高4,600万円（うちEC売上950万円）、営業利益560万円

    2030年度　　　　　　売上高4,900万円（うちEC売上1,200万円）、営業利益670万円

    店頭・卸の売上は年間3,500万円前後で横ばいと見込み、増加分はすべてEC経由とする。5年後にはEC比率を約24%まで高め、人口減少による店頭売上の下振れを吸収できる収益構造にする。'
  4-3: '戦略は、商品差で市場に入り、既存の接点で初期顧客を確保することである。競合B社が持たない「生菓子の冷凍発送」という商品差で参入し、EC運用の遅れは取扱を3品に絞ることで補う。初期顧客は広告ではなく、旅館5軒と店頭という既存の接点から獲得する。広告費をかけずに初年度の購入者を確保できることが、小規模事業者としての現実的な進め方である。

    戦術は3段階に分ける。第1段階は取扱3品での運用確立、第2段階は法人贈答への対応、第3段階は事業承継を見据えた移管である。年度別の行動計画は下表のとおりである。

    投資回収の見通しは、本補助事業の自己負担額450,000円に対し、初年度の営業利益増加額約87万円で1年未満である。2年目以降は追加の設備投資を要さないため、EC売上の増加分はそのまま利益の増加につながる。'
  '5': '冷凍生菓子のEC販売による全国贈答市場への販路開拓

    （24字）'
  6-1: '季節生菓子を急速凍結して全国に発送する体制を構築し、自社ECサイトで販売する。取組は(1)冷凍設備の導入、(2)冷凍適性に合わせた商品改良と包装、(3)自社ECサイトの構築、(4)首都圏での認知獲得の4つで構成する。

    補助事業期間は2026年4月から10月までの7か月とし、8月から販売を開始する。初年度の下期でEC売上200万円を確保することを目標とする。

    実施スケジュールは次のとおりである。

    4月　冷凍機の機種選定と発注、電源増設工事の手配、EC制作会社の選定

    5月　冷凍機の搬入・設置と電源工事、冷凍専用配合の最終試作（3品各10回）

    6月　解凍手順の確定、パッケージデザインの確定、ECサイトの構築着手

    7月　化粧箱の納品、ECサイト公開、旅館5軒への発送案内カード設置

    8月　販売開始。初期注文20件の配送品質を検証し、梱包と保冷材を調整

    9月　首都圏ギフト見本市に出展、法人取引の商談

    10月　販売データを踏まえ、取扱品目と価格を見直し

    実施体制は、代表者が冷凍工程と商品改良を、販売担当1名がECの受注・出荷を担当する。EC制作とデザインは外部委託とし、社内で新たに発生する業務は受注処理と梱包に限定する。受注処理は1件あたり約8分、月60件で月8時間と見積もっており、業務効率化により生まれる余力の範囲に収まる。'
  6-2: '当社が発送需要に応えられない原因は、技術ではなく設備にある。糖度調整によって冷凍に耐える配合は作れるが、緩慢凍結しかできない業務用冷蔵庫では、餡の水分が氷結晶化して解凍時に離水し、食感が変わる。2025年度に家庭用冷凍庫で行った試作では、解凍後に表面が水っぽくなり、贈答品として出せる状態にならなかった。

    急速凍結設備の有無が、発送事業の成否を分ける。本補助事業の目的は、この設備上の制約を外し、商圏外の需要を売上に変えることである。

    あわせて、商圏外の顧客が当社を見つけられる経路がないという広報上の制約も解消する。自社ECサイトと首都圏での見本市出展により、認知の範囲を商圏の外へ広げる。'
  6-3: '(1) 冷凍設備の導入

    CAS機能付き特殊冷凍機　1台　800,000円　○○冷機株式会社製（型式 CAS-80B）

    CAS方式は磁場を与えながら急速凍結することで氷結晶を微細化し、細胞壁の破壊を抑える方式で、解凍後の離水と食感変化を抑制できる。導入機は庫内容量80L、到達温度マイナス35度で、1回あたり生菓子120個を約40分で凍結できる。当社の現在の製造ロットは1品目あたり60個から80個であり、1回の運転で1ロットを処理できる。設置場所は1階製造場の北側とし、単相200Vの電源増設工事を伴う。

    (2) 商品改良と包装

    冷凍配送用 化粧箱・パッケージデザイン制作　2規格　150,000円（1規格75,000円）　□□デザイン事務所

    餡の糖度を既存の48度から44度に下げた冷凍専用配合を、季節生菓子3品（水まんじゅう、栗蒸し羊羹、いちご大福）に適用する。補助事業期間中に、導入した冷凍機で各品10回ずつの再試作を行い、解凍手順（冷蔵庫で6時間）を確定する。化粧箱は6個入り2,800円、12個入り4,600円の2規格とし、贈答用途の熨斗に対応する。解凍手順と消費期限を印刷し、受け取った人が扱いに迷わない状態にする。既存の店頭用パッケージは冷凍・結露に対応しておらず、流用できない。

    (3) 自社ECサイトの構築

    冷凍配送対応 自社ECサイト構築　一式　300,000円　△△ウェブ制作

    クール便の送料を配送先地域別に自動計算し、熨斗・名入れ・配送日指定を購入画面で選択できる仕様とする。モールではなく自社サイトとするのは、販売手数料の負担を避けるためと、購入者の連絡先を自社で保有して次回以降の案内に使うためである。初期顧客の獲得は店頭と旅館から行う。店頭では発送を希望しながら断ってきた客に会計時に案内カードを渡し、旅館5軒には客室に置く発送案内カードにQRコードを印刷して、宿泊客が滞在中に注文できる導線を作る。旅館には1件あたり200円の取次手数料を支払う。

    (4) 首都圏での認知獲得

    首都圏ギフト見本市 出展料　小間1区画　100,000円　主催者公表の出展料金表による

    来場するギフト専門店・百貨店の担当者に解凍後の実物を試食提供し、法人贈答の取引開拓につなげる。個人向けのECと並行して法人販路を持つことで、中元と歳暮の需要を取り込む。出展時には、解凍手順と配送条件を記載した商談用資料を用意する。

    補助対象経費の合計は1,350,000円、補助率2/3により補助金交付申請額は900,000円である（通常枠50万円＋インボイス特例50万円で上限100万円）。'
  6-4: '急速凍結設備を導入する理由は3点ある。

    第一に、これがなければ事業が成立しないためである。当社の季節生菓子は製造後2日で消費期限を迎える。緩慢凍結では解凍時に離水して食感が変わり、贈答品として出せない。冷凍の質が商品の質を直接決めるため、設備の選択が事業の可否そのものになる。

    第二に、当社の強みを活かせる唯一の手段だからである。餡の糖度を1度刻みで調整できるという強みは、冷凍という条件下で初めて差になる。常温流通の商品では、この強みは価格や知名度に埋もれる。設備を持つことで、強みが競合との差に変わる。

    第三に、機種の選定にあたって庫内容量が製造ロットに対して過大にならないことを条件としたためである。容量の大きい機種は導入費も電力消費も増えるが、1ロット60個から80個の当社では持て余す。80Lは1ロットを1回で処理でき、かつ将来の増産にも対応できる大きさである。

    ECサイトとパッケージについても同様に、冷凍配送に固有の要件（クール便送料の地域別計算、結露に耐える化粧箱、解凍手順の表示）があり、既存のものを流用できない。設備・包装・販売経路の3つが揃って初めて発送が成立するため、いずれも補助事業に含める必要がある。'
  '7': '本事業は、販路開拓と業務効率化の両面から生産性向上につながる。

    販路開拓の面では、商圏外の需要を売上に変えることで、人員を増やさずに売上を増やす。従業員1人あたり売上高は、2025年度の875万円から初年度に925万円、3年目に1,075万円へ向上する。

    業務効率化の面では、冷凍保存により製造をまとめられるようになる。製造回数は月22回から8回に減り、1回あたり約50分の段取りが月14回分削減される。月あたり約11時間40分、年間約140時間の作業時間が浮く。原材料の発注回数も月4回から2回に減り、月1時間が削減される。消費期限切れの廃棄（年間408個、廃棄率3.1%）もほぼ解消でき、原材料費ベースで年間約4万9千円の損失を回避できる。削減した時間はECの受注処理（月約8時間）と新商品の試作（月約4時間）に充てる。

    雇用については、3年目にEC売上が700万円規模となった時点でパート1名の新規雇用を検討する。現在の従業員4名のうち3名が女性であり、新規雇用も地域の子育て世代を想定している。受注処理と梱包は時間の融通が利く業務であるため、短時間勤務での就業機会を作れる。

    賃上げについては、営業利益の増加分を原資とする。初年度の営業利益増加額約87万円のうち、3分の1にあたる約29万円を従業員の処遇改善に充てる方針である。

    地域経済への効果としては、卸先の旅館5軒が宿泊客の発送依頼を取り次げるようになり、1軒あたり年間約34件の取次手数料収入（1件200円）を得る。宿泊客の要望に応えられることは、旅館側の顧客対応の幅も広げる。小豆と米粉の仕入先2社に対しては、製造量の増加により年間の発注額が約38万円増える。

    地方創生の観点では、冷凍発送に対応した和菓子が松本市の土産物に加わることで、観光客が持ち帰れる商品の幅が広がる。この形式は同様の設備を持たない市内他店にも展開でき、地域の土産需要の受け皿を広げる。

    当社の売上増、旅館と仕入先の収入増、地域の土産需要の受け皿拡大という三方の効果が同時に生じる構造である。'
  7-1: 'EC売上は初年度200万円、3年目700万円、5年目1,200万円を見込む。

    初年度の算出は次のとおりである。

    　客単価3,200円 × 新規購入者52人/月 × 12か月 = 年間1,996,800円

    客単価3,200円は、6個入り2,800円と12個入り4,600円の販売構成比を7対3として算出した。

    新規購入者52人/月は、3つの経路の合計である。

    　・店頭で発送を希望しながら断ってきた分　月20件（過去の実績件数）

    　・旅館5軒の宿泊客からの取次　月14件（旅館から受けた相談件数14回を根拠とする）

    　・ギフト見本市を経由した法人注文　月18件（法人1社あたり中元・歳暮で年20件、9社を想定）

    2年目以降は、初年度購入者のリピート率を30%と見込み、新規獲得分と合わせて積み上げる。

    利益の算出は次のとおりである。粗利率は店頭販売の62%に対し、EC販売は送料負担分を除いて54%と見込む。

    　1,996,800円 × 54% = 約107万円（初年度の粗利増加額）

    ここからEC運用費と広告費の年間約20万円を差し引くと、営業利益ベースの増加は約87万円である。2025年度の営業利益120万円に対して約72%の増加に相当する。

    3年目にEC売上700万円へ達した場合は次のとおりである。

    　7,000,000円 × 54% = 378万円（粗利増加額）

    売上高営業利益率は2025年度の3.4%から10%台へ改善する見込みである。

    年度別の試算は下表のとおりである。原価率は38%で一定と置いている。'
