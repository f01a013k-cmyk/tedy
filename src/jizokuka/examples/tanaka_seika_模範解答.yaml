project_id: tanaka_seika
koubo_id: r17
frame: 通常枠
specials: [インボイス特例]

sections:
  - key: company_overview
    heading: 企業概要
    body: |
      有限会社田中製菓は、1975年に長野県松本市中央で創業した和菓子製造小売業である。代表者は田中太郎、従業員は4名（製造3名、販売1名）で、本店1店舗での製造小売と、市内旅館5軒への卸売を行っている。

      主力商品は、どら焼き（1個180円）、大福（1個160円）、季節生菓子（1個250円から）の3系統で、常時18品目を製造している。売上構成は店頭小売が72%、旅館への卸が28%である。店頭の客層は60代以上が約7割を占め、1日の来店客数は平日約45人、土日約80人である。

      直近3期の売上高は、2023年度4,200万円、2024年度3,800万円、2025年度3,500万円と推移し、3期で16.7%減少した。減少の主因は、主商圏である店舗半径2km圏の人口減少と、既存客の高齢化による来店頻度の低下である。2025年度の営業利益は120万円、売上高営業利益率は3.4%にとどまる。

      製造設備は1998年導入の餡練機と2010年導入の蒸し器を中心とし、餡は小豆の仕入れから自社で炊き上げている。米粉は松本市内の精米所から仕入れ、保存料・着色料は使用していない。

  - key: market_needs
    heading: 顧客ニーズと市場の動向
    body: |
      松本市の人口は、国勢調査によれば2015年の24万3千人から2020年に24万1千人へ減少し、65歳以上の割合は28.8%に達している。当社の主商圏である店舗半径2km圏でも同じ傾向にあり、店頭販売のみに依存する現状では売上の回復は見込めない。

      一方、松本市の観光入込客数は、県の観光地利用者統計調査によれば2020年度の約392万人から2024年度には約610万人へ回復した。当社店頭でも観光客とみられる客の比率は、2023年度の約12%から2025年度には約19%へ上昇している。観光客からは「日持ちする商品を土産にしたい」「離れて暮らす家族に送りたい」という要望が月20件前後寄せられているが、季節生菓子の消費期限が製造後2日であるため、現在はすべて断っている。

      卸先の旅館5軒からも、宿泊客からの発送依頼を取り次げないかという相談を、2024年以降で延べ14回受けている。家計調査によれば、二人以上世帯の菓子類のインターネット購入額は2019年の年間1,180円から2024年には2,340円へ増加しており、贈答用和菓子をECで購入する行動は定着しつつある。

      需要を要約すると、「松本の和菓子を、離れた家族や知人へ、日持ちする形で贈りたい」という要望が、観光客と旅館宿泊客の双方に存在する。当社はこの要望に応える手段を現在持っていない。

  - key: strengths
    heading: 自社や自社の提供する商品・サービスの強み
    body: |
      第一の強みは、餡を内製していることによる配合調整の自由度である。創業以来50年にわたり小豆の仕入れから炊き上げまでを自社で行っており、糖度を44度から52度の範囲で1度刻みに調整できる。既製餡を使用する同業他社では調整できない領域であり、冷凍後の離水を抑える低糖度配合の試作を、2025年度に社内で12回実施している。

      第二に、原材料の産地を特定できることである。米粉は松本市内の精米所から、小豆は北海道十勝産を固定の仕入先から調達し、保存料・着色料・人工甘味料は使用していない。原材料表示は7品目以内に収まっており、贈答用途で原材料を確認する購入者に説明できる状態にある。

      第三に、卸先である市内旅館5軒との20年以上の取引である。各旅館の女将から宿泊客の反応が直接得られるため、季節生菓子の受容性を試作段階で確認できる。2024年度に投入した新商品3品のうち2品は、旅館からの指摘を反映して配合を変更したものである。

      弱みは、認知が店舗半径2km圏に限られること、および季節生菓子の消費期限が2日で遠方発送ができないことである。餡の調整技術と原材料の特定可能性という強みが、商圏外の顧客に届いていない。

  - key: policy_and_plan
    heading: 経営方針・目標と今後のプラン
    body: |
      経営方針は、店頭小売への依存から脱し、商圏外の顧客への冷凍発送を第二の収益の柱とすることである。商圏人口の減少は今後も続く一方、観光客と旅館宿泊客には発送需要が実在し、当社は餡の糖度調整技術によって冷凍適性の高い商品を作れる。この組み合わせを事業化する。

      数値目標は次のとおり置く。
      ・2026年度（初年度）: 売上高3,700万円（うちEC売上200万円）、営業利益180万円
      ・2027年度: 売上高4,000万円（うちEC売上450万円）、営業利益320万円
      ・2028年度: 売上高4,300万円（うちEC売上700万円）、営業利益450万円

      店頭・卸の売上は年間3,500万円前後で横ばいと見込み、増加分はすべてEC経由とする。初年度のEC売上200万円は、下期からの稼働を前提とした金額である。

      達成の手順は3段階とする。第1段階（2026年度）は、冷凍適性を確認できた季節生菓子3品に絞ってECで販売し、旅館5軒に発送案内カードを設置して初期顧客を確保する。第2段階（2027年度）は、取扱を8品に広げ、法人の贈答需要に対応する熨斗・名入れを整備する。第3段階（2028年度）は、代表者の長男（32歳）のUターンを前提に、ECの運用と新商品開発を移管し、事業承継の実務を開始する。

      本補助事業は第1段階に位置づけられる。冷凍設備とECサイトがなければ第1段階が成立せず、2027年度以降の計画にも着手できない。

project_sections:
  - key: project_name
    heading: 補助事業で行う事業名
    body: 冷凍生菓子のEC販売による全国贈答市場への販路開拓

  - key: sales_channel
    heading: 販路開拓等（生産性向上）の取組内容
    body: |
      季節生菓子を急速冷凍して全国に発送する体制を構築し、自社ECサイトで販売する。取組は(1)冷凍設備の導入、(2)冷凍適性に合わせた商品改良と包装、(3)自社ECサイトの構築、(4)首都圏での認知獲得の4つで構成する。

      (1) 冷凍設備の導入
      CAS機能付き特殊冷凍機1台（800,000円）を導入する。緩慢冷凍では餡の水分が氷結晶化し、解凍時に離水して食感が変わる。急速冷凍により氷結晶を微細化し、解凍後の食感変化を抑える。導入機は庫内容量80Lで、1回あたり生菓子120個を約40分で凍結でき、現在の製造ロット（1品目あたり60個から80個）に対応する。

      (2) 商品改良と包装
      餡の糖度を既存の48度から44度に下げた冷凍専用配合を、季節生菓子3品（水まんじゅう、栗蒸し羊羹、いちご大福）に適用する。2025年度に実施した12回の試作のうち、44度配合の3回で解凍後の離水が最も少なかった。冷凍配送に耐える化粧箱とパッケージのデザインは外部に委託する（150,000円）。6個入り・12個入りの2規格とし、贈答用途の熨斗に対応する。

      (3) 自社ECサイトの構築
      冷凍配送に対応した自社ECサイトを構築する（300,000円）。クール便の送料を配送先地域別に自動計算し、熨斗・名入れ・配送日指定を購入画面で選択できる仕様とする。旅館5軒には、客室に設置する発送案内カードにQRコードを印刷し、宿泊客が滞在中に注文できる導線を作る。

      (4) 首都圏での認知獲得
      首都圏で開催されるギフト見本市に出展する（出展料100,000円）。来場するギフト専門店・百貨店の担当者に解凍後の実物を試食提供し、法人贈答の取引開拓につなげる。

      実施スケジュールは次のとおりとする。
      ・4月: 冷凍機の機種選定と発注、EC制作会社の選定
      ・5月: 冷凍機の搬入・設置、冷凍専用配合の最終試作
      ・6月: パッケージデザインの確定、ECサイトの構築着手
      ・7月: ECサイト公開、旅館5軒への発送案内カード設置
      ・8月: 販売開始、初期注文の配送品質を検証
      ・9月: ギフト見本市出展、法人取引の商談
      ・10月: 販売データを踏まえた取扱品目と価格の見直し

      実施体制は、代表者が冷凍工程と商品改良を、販売担当1名がECの受注・出荷を担当する。EC制作とデザインは外部委託とし、社内の負担は受注処理に限定する。

  - key: efficiency
    heading: 業務効率化（生産性向上）の取組内容【任意記入】
    body: |
      急速冷凍機の導入により、製造計画の組み方が変わる。現在は季節生菓子の消費期限が2日であるため、旅館5軒の注文数を前日夕方に確認してから翌朝に製造しており、少量多頻度の製造を月あたり22回行っている。冷凍保存が可能になれば、製造をまとめて行い在庫から出荷できるため、製造回数を月8回に減らせる。

      1回あたりの段取り（餡の炊き上げ、蒸し器の立ち上げ、清掃）に約50分を要しており、製造回数が月14回減ることで、月あたり約11時間40分の作業時間が削減される。削減された時間は、ECの受注処理と新商品の試作に充てる。

      また、消費期限切れにより廃棄していた季節生菓子は、2025年度で月平均34個、年間408個であった。冷凍保存により廃棄をほぼ解消でき、原材料費ベースで年間約4万9千円の損失を回避できる。

  - key: effect
    heading: 補助事業の効果
    body: |
      (1) 自社への効果
      EC売上は初年度200万円、3年目700万円を見込む。初年度の内訳は、客単価3,200円 × 新規購入者52人/月 × 12か月 = 年間1,996,800円である。客単価は6個入り2,800円と12個入り4,600円の販売構成比を7対3として算出した。新規購入者52人/月は、店頭で発送を希望しながら断ってきた月20件、旅館5軒の宿泊客からの依頼を取り次ぐ月14件、ギフト見本市経由の法人注文を月18件と見積もった合計である。

      粗利率は店頭販売の62%に対し、EC販売は送料負担分を除いて54%と見込む。初年度の粗利増加額は 1,996,800円 × 54% = 約107万円となり、2025年度の営業利益120万円に対して約89%の増加に相当する。

      (2) 地域・取引先への効果
      卸先の旅館5軒は、宿泊客の発送依頼を取り次げるようになり、1軒あたり月14件の取次手数料収入（1件200円）を得る。小豆と米粉の仕入先2社に対しては、製造量の増加により年間の発注額が約38万円増える見込みである。冷凍発送に対応した和菓子が松本市の土産物に加わることは、同様の設備を持たない市内他店にも展開可能な形式であり、地域の土産需要の受け皿を広げる。

