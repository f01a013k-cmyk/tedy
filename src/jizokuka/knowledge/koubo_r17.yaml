# ============================================================================
# 小規模事業者持続化補助金 公募要領ナレッジ
# ============================================================================
# !!! 重要 !!!
# ここに記載された金額・補助率・様式構成は「回次」ごとに変わります。
# 必ず申請する回次の公募要領PDFを開いて verified: true に更新してください。
# verified: false のまま出力すると、全成果物に未検証警告が付きます。
# ============================================================================

meta:
  koubo_id: r17
  display_name: 第17回 小規模事業者持続化補助金〈一般型〉
  source_url: https://s23.jizokukahojokin.info/
  verified: false          # 公募要領PDFと突合したら true に
  verified_by: null
  verified_at: null
  note: |
    初期値は一般に流通している情報に基づく雛形です。申請前に必ず
    `jizokuka koubo verify` で突合チェックリストを出力し、実物と照合してください。

# --- 申請枠ごとの補助上限・補助率 -------------------------------------------
frames:
  通常枠:
    limit_yen: 500000
    rate: "2/3"             # 分数文字列。float 近似で端数が出るのを避ける
    rate_label: "2/3"
    description: 販路開拓・業務効率化の一般的な取組
  賃金引上げ枠:
    limit_yen: 2000000
    rate: "2/3"
    rate_label: "2/3（赤字事業者は3/4）"
    rate_if_deficit: "3/4"
    description: 事業場内最低賃金を地域別最低賃金＋50円以上に引き上げる事業者
    extra_requirements:
      - 補助事業終了時点で事業場内最低賃金が地域別最低賃金＋50円以上であること
      - 賃金引上げ計画の表明書の提出が必要
  卒業枠:
    limit_yen: 2000000
    rate: "2/3"
    rate_label: "2/3"
    description: 常時使用する従業員を増やし小規模事業者の定義を超える事業者
  後継者支援枠:
    limit_yen: 2000000
    rate: "2/3"
    rate_label: "2/3"
    description: アトツギ甲子園のファイナリスト等
  創業枠:
    limit_yen: 2000000
    rate: "2/3"
    rate_label: "2/3"
    description: 特定創業支援等事業の支援を受け、過去3年以内に開業した事業者

# --- 上乗せ特例 --------------------------------------------------------------
specials:
  インボイス特例:
    add_limit_yen: 500000
    condition: 免税事業者から適格請求書発行事業者に転換した（する）事業者
  賃金引上げ特例:
    add_limit_yen: 1500000
    condition: 該当回次の公募要領で要確認

# --- 補助対象経費区分 --------------------------------------------------------
# cap_rule: この経費区分に固有の上限ルール（コードで検証する）
expense_categories:
  - code: "1"
    name: 機械装置等費
    examples: [製造装置, 印刷機, 3Dプリンタ, POSレジ, 専用ソフトウェア]
    cap_rule: null
    caution: 汎用性が高く目的外使用になり得るもの（PC・タブレット・スマホ・自動車等）は対象外
  - code: "2"
    name: 広報費
    examples: [チラシ, ポスター, 看板, 新聞広告, ダイレクトメール, 移動販売車のラッピング]
    cap_rule: null
    caution: 単なる会社案内・営業所案内は対象外。補助事業の商品/サービスの広報であること
  - code: "3"
    name: ウェブサイト関連費
    examples: [ホームページ制作, ECサイト構築, LP制作, ネット広告, SEO対策, システム開発]
    cap_rule:
      type: ratio_of_grant
      ratio: 0.25
      message: ウェブサイト関連費は補助金交付申請額の1/4が上限。かつ単独申請は不可
    caution: この経費のみでの申請は不可。他の経費と組み合わせること
  - code: "4"
    name: 展示会等出展費
    examples: [展示会出展料, 商談会参加費, 通訳料, 翻訳料]
    cap_rule: null
    caution: 商品・サービスのPRが目的であること。飲食費は対象外
  - code: "5"
    name: 旅費
    examples: [展示会出展の旅費, 販路開拓の出張費]
    cap_rule: null
    caution: 公的機関の旅費規程に準拠。日当・宿泊費に上限あり
  - code: "6"
    name: 新商品開発費
    examples: [試作品開発の原材料費, デザイン費, 金型製作費]
    cap_rule: null
    caution: 完成品の販売用在庫は対象外
  - code: "7"
    name: 資料購入費
    examples: [図書, 資料]
    cap_rule: null
    caution: 取得単価10万円未満のもの
  - code: "8"
    name: 雑役務費
    examples: [臨時アルバイト代, 派遣労働者の駐在費]
    cap_rule: null
    caution: 補助事業のために雇い入れた者に限る
  - code: "9"
    name: 借料
    examples: [機器リース料, 店舗賃借料（一時的）]
    cap_rule: null
    caution: 補助事業実施期間内の分のみ
  - code: "10"
    name: 設備処分費
    examples: [既存設備の解体・廃棄費用, 賃借している設備の返却費用]
    cap_rule:
      type: ratio_of_total_expense
      ratio: 0.5
      message: 設備処分費は補助対象経費総額の1/2が上限
    caution: null
  - code: "11"
    name: 委託・外注費
    examples: [店舗改装工事, 分析委託, デザイン外注]
    cap_rule: null
    caution: 契約書等の締結が必要。自社の役員・従業員への外注は不可

# --- 補助対象外経費（決定論的にNGワード検出する） ----------------------------
ineligible_keywords:
  - keyword: [パソコン, PC, ノートパソコン, タブレット, iPad, スマートフォン, スマホ, 携帯電話]
    reason: 汎用性が高く目的外使用になり得るため対象外
  - keyword: [自動車, 車両, 乗用車, トラック, バイク]
    reason: 車両本体は原則対象外（移動販売車等の改造費は要件を満たせば可）
  - keyword: [家賃, 地代, 光熱費, 電気代, 水道代, 通信費, 電話代, インターネット回線]
    reason: 事業の運営に係る恒常的な経費は対象外
  - keyword: [人件費, 給与, 賞与, 社会保険料, 役員報酬]
    reason: 自社従業員の人件費は対象外（雑役務費の要件を満たす場合を除く）
  - keyword: [飲食費, 接待費, 交際費, 懇親会]
    reason: 対象外
  - keyword: [税金, 消費税, 印紙代, 振込手数料]
    reason: 対象外
  - keyword: [不動産取得, 土地, 建物購入]
    reason: 対象外
  - keyword: [商品券, 金券, 景品, ノベルティ]
    reason: 換金性の高いものは対象外
  - keyword: [中古品]
    reason: 原則対象外（3社以上の相見積がある場合等の例外要件を要確認）

# --- 経費のその他ルール ------------------------------------------------------
expense_rules:
  min_total_expense_yen: 0
  quotation_threshold_yen: 500000
  quotation_threshold_message: 税抜単価50万円以上の場合、2社以上の相見積書が必要
  unit_price_note: 単価は税抜で記載する（免税事業者は税込可の場合あり／要公募要領確認）

# --- 様式2「経営計画書兼補助事業計画書①」の構成 -----------------------------
# 分量は min_chars / target_chars / max_chars の3段で管理する。
#   min_chars    これを下回ると「情報量不足」として要修正（リライトが走る）
#   target_chars 執筆時に狙わせる分量
#   max_chars    これを超えると記入欄に収まらない
# hard_limit: true の項目（事業名30字）だけが様式上の絶対上限で、
# それ以外は「採択レベルの分量」の目安である。記入欄の実サイズや
# 支援機関の方針に合わせて調整すること。
form_yoshiki2:
  title: 経営計画書兼補助事業計画書（様式2）
  sections:
    - key: company_overview
      number: "1"
      heading: 企業概要
      min_chars: 900
      target_chars: 1100
      max_chars: 1400
      review_axes: [経営状況分析の妥当性]
      guidance: |
        沿革（創業経緯・承継の有無）、事業内容、主力商品・サービスを品目別の
        単価と売上構成比まで示す。顧客層・客数・客単価・商圏、従業員数と役割分担、
        保有設備を具体的に書く。直近3期の売上・営業利益の推移と、
        増減の理由を原価率・客数・来店頻度などの内訳まで分解して説明する。
    - key: market_needs
      number: "2"
      heading: 顧客ニーズと市場の動向
      min_chars: 1000
      target_chars: 1250
      max_chars: 1600
      review_axes: [経営状況分析の妥当性]
      guidance: |
        商圏の人口動態、狙う市場の規模・成長性を出典付きで示し、
        自社の商圏・顧客の実データに必ず接続する。顧客ニーズは
        「誰が・何に困っていて・いくら払う意思があるか」の粒度まで落とし、
        断った件数・相談件数など実際に発生している数字で裏づける。
        ターゲット層を年代・用途・価格帯で特定する。
    - key: strengths
      number: "3"
      heading: 自社や自社の提供する商品・サービスの強み
      min_chars: 900
      target_chars: 1100
      max_chars: 1400
      review_axes: [経営状況分析の妥当性]
      guidance: |
        強みを3点以上、競合と比較した相対的な優位として書く。
        「丁寧な対応」等の主観語は禁止。技術・設備・資格・立地・顧客基盤・
        リピート率など検証可能な事実で示す。弱みも3点以上挙げ、
        強みが弱みによってどう封じられているかを説明して補助事業につなげる。
    - key: policy_and_plan
      number: "4"
      heading: 経営方針・目標と今後のプラン
      min_chars: 1000
      target_chars: 1250
      max_chars: 1600
      review_axes: [経営方針・目標と今後のプランの適切性]
      guidance: |
        1〜3の分析から論理的に導出された方針であること。
        経営理念を示したうえで、3〜5年の数値目標（売上・利益・客数等）を
        年度別に置く。達成手順を段階に分け、各段階の目標値を示す。
        その達成手段として今回の補助事業が位置づけられていること。
  project_sections:
    - key: project_name
      number: "1"
      heading: 補助事業で行う事業名
      min_chars: 15
      target_chars: 25
      max_chars: 30
      hard_limit: true
      review_axes: [補助事業計画の有効性]
      guidance: |
        30文字以内厳守。「誰に・何を・どうやって」が読み取れる具体名にする。
        例:「特殊冷凍機導入による高級和菓子の全国EC販路開拓」
    - key: sales_channel
      number: "2"
      heading: 販路開拓等（生産性向上）の取組内容
      min_chars: 2000
      target_chars: 2500
      max_chars: 3200
      review_axes: [補助事業計画の有効性, 積算の透明・適切性]
      guidance: |
        本文の心臓部。最も分量を割く項目である。
        事業の概要、導入の背景・目的、取組ごとの具体的内容、
        なぜその設備・手段が必要なのか、実施スケジュール、実施体制、
        想定リスクと対応まで書く。「何を・いつ・誰が・いくらで・どうやって」を
        全て埋め、経費明細表の各費目が本文のどの取組に対応するかを明示する。
        機器は型式・能力・メーカーまで、金額は経費明細と一致させる。
    - key: efficiency
      number: "3"
      heading: 業務効率化（生産性向上）の取組内容【任意記入】
      min_chars: 600
      target_chars: 800
      max_chars: 1100
      optional: true
      review_axes: [補助事業計画の有効性]
      guidance: |
        任意だが、記載すると生産性向上の説得力が増す。
        現状の作業回数・所要時間と、改善後の数字を並べ、
        削減される作業時間を「時間/月」「時間/年」で定量化する。
        浮いた時間を何に充てるかまで書く。
    - key: effect
      number: "4"
      heading: 補助事業の効果
      min_chars: 900
      target_chars: 1100
      max_chars: 1400
      review_axes: [補助事業計画の有効性]
      guidance: |
        自社への効果（売上・利益・生産性）を年度別の数値で示し、
        算出根拠（客単価×客数×稼働日数 等の式）と、式に使った各数値の
        出所まで分解する。従業員1人あたり売上高など生産性指標にも触れる。
        地域・取引先・雇用への波及効果も併せて書く。

# --- 様式3「補助事業計画書②」 ----------------------------------------------
form_yoshiki3:
  title: 補助事業計画書②（様式3）
  sections:
    - key: expense_table
      heading: 経費明細表
    - key: funding_table
      heading: 資金調達方法

# --- 審査の観点（加点審査／書面審査） ---------------------------------------
review_axes:
  - key: 経営状況分析の妥当性
    weight: 25
    official_text: 自社の経営状況分析の妥当性
    criteria:
      - 自社の商品・サービスの強みを理解しているか
      - 経営状況（強み・弱み）が客観的な根拠を伴って把握されているか
      - 顧客ニーズ・市場動向が具体的な出典・数値を伴って分析されているか
  - key: 経営方針・目標と今後のプランの適切性
    weight: 25
    official_text: 経営方針・目標と今後のプランの適切性
    criteria:
      - 経営方針・目標が経営状況分析から論理的に導かれているか
      - 今後の展望が具体的・現実的で、数値目標が年度別に置かれているか
      - 小規模事業者の実情に合った実現可能な内容か
  - key: 補助事業計画の有効性
    weight: 35
    official_text: 補助事業計画の有効性
    criteria:
      - 補助事業計画が経営計画の実現に真に必要なものか
      - 販路開拓等の取組内容が具体的で、実現可能性が高いか
      - 地域資源・地域の特性を活かしているか
      - ITを有効に活用する取組が含まれているか
      - 補助事業の効果が数値で示され、算出根拠が妥当か
  - key: 積算の透明・適切性
    weight: 15
    official_text: 積算の透明・適切性
    criteria:
      - 補助事業に必要な経費が過不足なく計上されているか
      - 単価・数量の根拠が明確で、経費として過大でないか
      - 経費明細表の各費目が事業計画本文と対応しているか

# --- 政策加点（該当すれば申告） ---------------------------------------------
policy_bonus:
  - key: 賃金引上げ枠
    description: 事業場内最低賃金を地域別最低賃金＋50円以上に引き上げる
  - key: 経営力向上計画
    description: 経営力向上計画の認定を受けている
  - key: 事業承継
    description: 代表者が満60歳以上で後継者候補が補助事業を実施する
  - key: 東京圏からの移転
    description: 過疎地域等へ本社・本店を移転する
  - key: 一般事業主行動計画
    description: くるみん・えるぼし認定等
  - key: 電子申請
    description: 電子申請（Jグランツ）による提出

# --- 禁止・注意表現（LLM出力の自動検査に使う） ------------------------------
forbidden_expressions:
  - pattern: "(?:絶対に|必ず|確実に)(?:成功|儲か|達成)"
    reason: 断定的な成功保証は審査上マイナス。根拠ベースの記述に置き換える
  - pattern: "(?:日本一|世界一|業界No\\.?1|唯一無二)"
    reason: 客観的根拠のない最上級表現。出典なしでは使用不可
  - pattern: "(?:頑張り|努力し|一生懸命|誠心誠意)"
    reason: 精神論。具体的な手段・数値に置き換える
  - pattern: "(?:と思われる|かもしれない|だろう)"
    reason: 曖昧表現。断定できないなら根拠を補う
  - pattern: "(?:AI|DX)(?:を活用|化)(?:し|する)(?![^。]{0,40}(?:により|ため|こと|で))"
    reason: バズワードのみで手段が不明。具体的な仕組みを書く
