# ============================================================================
# 文章品質ルール（決定論的チェック用）
# ============================================================================
# LLM を呼ばずに「採択されない書き方」を検出する。
# 審査観点そのものではなく、審査で確実に減点される書き方の型を突く。
#
# これらは公募要領に明記された規程ではなく、審査実務からの経験則である。
# 回次に依存しないため koubo_*.yaml とは分離している。
# ============================================================================

meta:
  version: 1

# --- 主観形容詞: 検証できない主張。審査上ゼロ点 --------------------------------
subjective_words:
  - words: [丁寧, こだわり, こだわっ, 高品質, 良質, 上質, 最高, 抜群, 優れた, 素晴らし]
    reason: 検証できない自己評価。工程・資格・実測値・第三者評価に置き換える
  - words: [おいしい, 美味しい, 絶品, 極上]
    reason: 味の主観評価。受賞歴・リピート率・指名率などの事実に置き換える
  - words: [安心, 安全, 信頼, 親身, 心を込め, 真心, 誠実]
    reason: 情緒表現。認証・保証制度・具体的な対応手順に置き換える
  - words: [豊富な, 幅広い, 多彩な, 多様な]
    reason: 数量が不明。「◯種類」「◯品目」と数える

# --- 曖昧な数量表現: 数えられるものを数えていない -----------------------------
vague_quantifiers:
  words: [多くの, 数多く, さまざま, 様々, いろいろ, 一定の, ある程度, かなり, 大幅に, 大きく, 若干, 徐々に]
  reason: 数量が不明。実数または割合に置き換える

# --- 推定値の出所を人に帰属させない ------------------------------------------
# モデルが逆算した数値を「代表への聞き取りに基づく」と書くと、提出書類の側で
# 出所を偽装することになる。〈要確認〉を残すより危うい。
attribution_phrases:
  words: [聞き取りに基づく, 聞き取りによる, ヒアリングに基づく, ヒアリングによる,
          事業者からの申告, 代表者の証言, 実地調査によれば]
  reason: |
    入力に実際の聞き取り結果がある場合を除き、この表現は使わない。
    推定した数値は「〜から算出した推計値である」と推定であることを明示するか、
    〈要確認: …〉を残す。出所を人に帰属させると、事実確認のしようがなくなる。

# --- バズワードの空振り: 手段が書かれていない ---------------------------------
buzzwords:
  words: [DX, AI活用, IoT, ブランディング, シナジー, ソリューション, イノベーション, 付加価値の向上]
  reason: 手段が具体化されていない。何をどう変えるのかを書く
  # 近傍にこれらがあれば具体化されているとみなす
  concretizers: [システム, ソフト, 機器, 導入, 自動, 連携, 削減, 時間, 円, "％", "%"]

# --- セクション別の必須要件 --------------------------------------------------
# min_numbers: 本文に含まれるべき数値の最低個数（年号を除く）
section_requirements:
  company_overview:
    min_numbers: 12
    hints: [創業年, 従業員数, 売上高の推移, 商品点数, 客数]
  market_needs:
    min_numbers: 9
    require_source: true
    hints: [市場規模, 成長率, 商圏人口, 統計の出典]
  competition:
    min_numbers: 10
    require_comparison: true
    hints: [競合の店舗数・従業員数, 競合の価格帯, 自社との価格差, 競合のEC対応状況, 自社が優位な点, 自社が劣位な点]
  strengths:
    min_numbers: 8
    hints: [年数, 保有設備, 資格, リピート率, 歩留まり]
  policy_and_plan:
    min_numbers: 12
    require_yearly_target: true
    hints: [年度別の売上目標, 利益目標, 客数目標]
  project_name:
    min_numbers: 0
  sales_channel:
    min_numbers: 15
    require_schedule: true
    hints: [実施月, 金額, 数量, 想定客数, 単価]
  efficiency:
    min_numbers: 6
    require_time_saving: true
    hints: [削減時間, 作業回数]
  effect:
    min_numbers: 12
    require_formula: true
    hints: ["売上増の算出式（単価×客数×期間）", 利益率, 波及効果]

# --- 検出パターン ------------------------------------------------------------
patterns:
  # 算出式: 数値どうしの掛け算
  # 「客単価3,200円 × 新規購入者52人」のように、掛ける側にラベルが付くのが実際の書き方。
  # 記号の直後に数字を要求すると実務の文章を取りこぼすため、短いラベルを挟める形にする。
  formula: '[0-9０-９][0-9０-９,，\.]*\s*(?:円|人|個|件|枚|台|kg|g|本|食|箱|回|日|月|%|％)?\s*[×✕xX＊*]\s*[^。、\n]{0,14}?[0-9０-９]'
  # 出典: 統計・調査への言及
  source: '(?:出典|による|によれば|統計|白書|調査|年鑑|報告書|センサス|国勢調査|経済センサス)'
  # 実施スケジュール: ◯月 が複数 または 四半期表現
  schedule_month: '(?:[0-9０-９]{1,2}\s*月|第[0-9０-９一二三四]\s*四半期)'
  # 比較表現: 競合と自社を並べて論じているか
  comparison: '(?:に対し|と比べ|と比較|一方|優位|劣位|上回|下回|同水準|先行し|当社より|当社は)'
  # 年度別目標
  yearly_target: '(?:[0-9０-９]{4}\s*年度|翌年度|[0-9０-９]\s*年後|初年度|[0-9０-９]\s*年目)'
  # 時間削減
  time_saving: '(?:[0-9０-９][0-9０-９,\.]*\s*(?:時間|分|人日|人時))'
  # 数値トークン（年号らしきものは別で除外する）
  number: '[0-9０-９][0-9０-９,，\.]*'
  # 年号（数値カウントから除外）
  year_like: '(?:19|20)[0-9０-９]{2}\s*年'

# --- 読みやすさ --------------------------------------------------------------
readability:
  max_sentence_chars: 110
  max_sentence_reason: 一文が長すぎる。審査員は短時間で読むため、2文に分割する

# --- セクション間の重複 ------------------------------------------------------
duplication:
  min_run_chars: 28
  reason: 別セクションと同じ記述が繰り返されている。記入欄の無駄遣いで減点要因
