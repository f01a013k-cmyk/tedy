# ============================================================================
# セクション別 few-shot（悪い例 / 良い例）
# ============================================================================
# 「具体的に書け」という抽象指示より、対比のほうが圧倒的に効く。
# プロンプトには該当セクションの1組だけを注入し、トークンを浪費しない。
#
# 良い例は examples/tanaka_seika_模範解答.yaml（架空事例）から抜粋している。
# 数値は架空。書き方の型を示すためのものである。
# ============================================================================

meta:
  version: 1
  source: examples/tanaka_seika_模範解答.yaml

examples:
  company_overview:
    bad: |
      当社は長野県松本市で長年和菓子を製造販売している老舗です。地元の皆様に愛され、
      おいしい和菓子を提供してまいりました。近年は売上が減少傾向にあります。
    bad_why: 創業年・従業員数・商品構成・売上高のいずれも数値がなく、審査員は事業規模を把握できない。「愛され」「おいしい」は検証できない。
    good: |
      有限会社田中製菓は、1975年に長野県松本市中央で創業した和菓子製造小売業である。
      代表者は田中太郎、従業員は4名（製造3名、販売1名）で、本店1店舗での製造小売と、
      市内旅館5軒への卸売を行っている。主力商品はどら焼き（1個180円）、大福（1個160円）、
      季節生菓子（1個250円から）の3系統で、常時18品目を製造している。直近3期の売上高は
      2023年度4,200万円、2024年度3,800万円、2025年度3,500万円と推移し、3期で16.7%減少した。
      減少の主因は、主商圏である店舗半径2km圏の人口減少と、既存客の高齢化による来店頻度の低下である。
    good_why: 規模・商品・価格・売上推移が数値で示され、さらに「なぜ減ったか」まで踏み込んでいる。

  market_needs:
    bad: |
      近年、EC市場は拡大しており、和菓子のニーズも多様化しています。観光需要も回復傾向にあり、
      お土産を求めるお客様が増えています。当社にとって大きなチャンスです。
    bad_why: 出典がなく、どこの市場の話かも不明。自社の商圏・顧客データに一切接続していない。一般論として処理され加点されない。
    good: |
      松本市の人口は、国勢調査によれば2015年の24万3千人から2020年に24万1千人へ減少し、
      65歳以上の割合は28.8%に達している。一方、松本市の観光入込客数は、県の観光地利用者統計調査に
      よれば2020年度の約392万人から2024年度には約610万人へ回復した。当社店頭でも観光客とみられる
      客の比率は、2023年度の約12%から2025年度には約19%へ上昇している。観光客からは「日持ちする
      商品を土産にしたい」という要望が月20件前後寄せられているが、季節生菓子の消費期限が製造後
      2日であるため、現在はすべて断っている。
    good_why: 統計の出典を明示したうえで、自社店頭の実データ（観光客比率・月20件の断り）に接続している。「機会がある」ではなく「取りこぼしている実数」を示している。

  strengths:
    bad: |
      当社の強みは、創業以来受け継がれてきた伝統の技術と、素材へのこだわりです。
      お客様一人ひとりに丁寧に対応し、高品質な商品を提供しています。
    bad_why: 「伝統」「こだわり」「丁寧」「高品質」はすべて検証不能な自己評価で、審査上ゼロ点。競合と比べて何が違うのかが読み取れない。
    good: |
      第一の強みは、餡を内製していることによる配合調整の自由度である。創業以来50年にわたり
      小豆の仕入れから炊き上げまでを自社で行っており、糖度を44度から52度の範囲で1度刻みに
      調整できる。既製餡を使用する同業他社では調整できない領域であり、冷凍後の離水を抑える
      低糖度配合の試作を、2025年度に社内で12回実施している。
    good_why: 「餡の内製」という事実から、糖度1度刻みという検証可能な能力を示し、競合（既製餡使用）との差を明示している。試作12回という実績が裏付けになっている。

  policy_and_plan:
    bad: |
      今後はECを活用し、販路を拡大してまいります。若い世代にも当社の商品を届け、
      売上の向上を目指します。地域に貢献できる企業を目指してまいります。
    bad_why: 数値目標がなく、いつ何をどこまでやるのかが不明。前段の経営状況分析と論理的につながっていない。
    good: |
      経営方針は、店頭小売への依存から脱し、商圏外の顧客への冷凍発送を第二の収益の柱とする
      ことである。商圏人口の減少は今後も続く一方、観光客と旅館宿泊客には発送需要が実在し、
      当社は餡の糖度調整技術によって冷凍適性の高い商品を作れる。この組み合わせを事業化する。
      数値目標は、2026年度（初年度）売上高3,700万円（うちEC売上200万円）・営業利益180万円、
      2027年度売上高4,000万円（うちEC売上450万円）・営業利益320万円、2028年度売上高4,300万円
      （うちEC売上700万円）・営業利益450万円と置く。
    good_why: 「1〜3で述べた弱み（商圏縮小）×強み（糖度調整）」から方針を導出し、年度別の売上・利益目標まで落としている。

  project_name:
    bad: 販路開拓事業
    bad_why: 誰に何をどうやって売るのかが全く読み取れない。審査員が最初に見る箇所であり、ここで印象が決まる。
    good: 冷凍生菓子のEC販売による全国贈答市場への販路開拓
    good_why: 「何で（冷凍）」「何を（生菓子）」「どこへ（全国贈答市場）」が25文字に収まっている。

  sales_channel:
    bad: |
      冷凍機を導入してECサイトを立ち上げ、全国に向けて商品を販売します。SNSも活用して
      積極的にPRし、新規顧客の獲得を図ります。
    bad_why: 機種・能力・金額・時期・担当者が一切ない。経費明細のどの費目に対応するかも不明で、「積算の透明・適切性」でも減点される。
    good: |
      CAS機能付き特殊冷凍機1台（800,000円）を導入する。緩慢冷凍では餡の水分が氷結晶化し、
      解凍時に離水して食感が変わる。急速冷凍により氷結晶を微細化し、解凍後の食感変化を抑える。
      導入機は庫内容量80Lで、1回あたり生菓子120個を約40分で凍結でき、現在の製造ロット
      （1品目あたり60個から80個）に対応する。
      実施スケジュールは、4月に機種選定と発注、5月に搬入・設置と冷凍専用配合の最終試作、
      6月にパッケージデザイン確定とECサイト構築着手、7月にECサイト公開とする。
    good_why: 「なぜその機種が必要か」を技術的理由（氷結晶の微細化）で説明し、能力（120個/40分）が自社の製造ロットに合うことまで示している。月次スケジュールが実現可能性の裏付けになっている。

  efficiency:
    bad: |
      冷凍機の導入により、業務の効率化が図られ、生産性が向上します。
      空いた時間は新商品の開発に充てます。
    bad_why: 何がどれだけ効率化されるのか定量化されていない。「生産性向上」という言葉だけでは加点されない。
    good: |
      現在は季節生菓子の消費期限が2日であるため、旅館5軒の注文数を前日夕方に確認してから
      翌朝に製造しており、少量多頻度の製造を月あたり22回行っている。冷凍保存が可能になれば、
      製造をまとめて行い在庫から出荷できるため、製造回数を月8回に減らせる。1回あたりの段取り
      （餡の炊き上げ、蒸し器の立ち上げ、清掃）に約50分を要しており、製造回数が月14回減ることで、
      月あたり約11時間40分の作業時間が削減される。
    good_why: 現状（月22回）と改善後（月8回）を数え、1回あたり50分の段取り時間から削減時間を算出している。審査員が検算できる。

  effect:
    bad: |
      本事業により、売上の増加が見込まれます。また、地域の活性化にも貢献できると考えています。
      従業員の意識向上にもつながり、企業の成長に寄与します。
    bad_why: 数値も算出根拠も皆無。「見込まれます」「考えています」という曖昧表現で、審査員は効果を検証できない。即座に大幅減点となる。
    good: |
      EC売上は初年度200万円を見込む。内訳は、客単価3,200円 × 新規購入者52人/月 × 12か月
      = 年間1,996,800円である。客単価は6個入り2,800円と12個入り4,600円の販売構成比を7対3として
      算出した。新規購入者52人/月は、店頭で発送を希望しながら断ってきた月20件、旅館5軒の宿泊客
      からの依頼を取り次ぐ月14件、ギフト見本市経由の法人注文を月18件と見積もった合計である。
      粗利率はEC販売で54%と見込み、初年度の粗利増加額は1,996,800円 × 54% = 約107万円となる。
    good_why: 算出式が明示され、さらに式に使った各数値（客単価・客数）の根拠まで分解されている。前段で述べた「月20件断っている」という事実と接続している。
